name: Raphael Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lld llvm clang libssl-dev libelf-dev aarch64-linux-gnu-gcc

      - name: Apply Scheduler Patches
        run: |
          echo "Applying scheduler performance tweaks..."
          # Example: Boosting the default scheduler latency
          sed -i 's/sysctl_sched_latency = 6000000ULL/sysctl_sched_latency = 4000000ULL/g' kernel/sched/fair.c
          # Adding a simple full throttle definition if missing
          sed -i '1i #define SCHED_FULL_THROTTLE 1' kernel/sched/sched.h

      - name: Set Up Build Environment
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV

      - name: Configure and Build
        run: |
          # Generate the defconfig for Raphael
          make raphael_defconfig
          
          # Start the build
          # -Wno-error ensures that minor warnings in old vendor code don't stop the build
          # especially useful for Android 15's strict compiler
          make -j$(nproc --all) \
            KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-strict-prototypes" \
            LLVM=1 \
            LLVM_IAS=1 \
            Image.gz-dtb
            
      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Raphael-Kernel-A15
          path: arch/arm64/boot/Image.gz-dtb
