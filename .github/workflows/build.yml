name: Raphael Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc build-essential flex bison lld llvm clang libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu device-tree-compiler \
            python3 git zip

      - name: Set Up Build Environment
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV

      - name: Configure and Patch
        run: |
          # 1. Base Config
          make ARCH=arm64 raphael_defconfig
          
          # 2. LINKER FIX: Force enable missing dependencies
          scripts/config --enable CONFIG_DRM_MSM
          scripts/config --enable CONFIG_QCOM_SHAREDMEM_ENUMERATOR
          scripts/config --enable CONFIG_PINCTRL_MSM
          scripts/config --enable CONFIG_UFS_QCOM_ICE
          scripts/config --enable CONFIG_CRYPTO_DEV_QCOM_ICE
          scripts/config --enable CONFIG_REGULATOR_QPNP_POWERNON
          scripts/config --enable CONFIG_ICNSS
          scripts/config --enable CONFIG_ICNSS_QMI
          make ARCH=arm64 olddefconfig

          # 3. GLOBAL FIX: definitions
          cat <<EOF > fix_global.h
          #ifndef _FIX_GLOBAL_H
          #define _FIX_GLOBAL_H
          #define SCHED_FULL_THROTTLE 1
          #define FULL_THROTTLE_BOOST 1
          #define MAX_MSG_SIZE 255
          #endif
          EOF
          sed -i "1i #include \"$(pwd)/fix_global.h\"" kernel/sched/sched.h
          
          # 4. MANUAL FIX: LED Header
          cat <<EOF > drivers/leds/leds.h
          #ifndef __LEDS_H_INCLUDED
          #define __LEDS_H_INCLUDED
          #include <linux/device.h>
          #include <linux/rwlock.h>
          #include <linux/list.h>
          #include <linux/leds.h>
          #include <linux/rwsem.h>
          extern struct rw_semaphore leds_list_lock;
          extern struct list_head leds_list;
          void led_stop_software_blink(struct led_classdev *led_cdev);
          void led_set_brightness_nosleep(struct led_classdev *led_cdev, enum led_brightness value);
          static inline struct led_classdev *led_trigger_get_target(struct led_trigger *trig) { return NULL; }
          #endif
          EOF

          # 5. HID & MHI Fixes
          [ -f drivers/hid/hid-trace.h ] && ln -sf drivers/hid/hid-trace.h ./hid-trace.h
          if [ -f drivers/bus/mhi/controllers/mhi_arch_qcom.c ]; then
             sed -i "1i #include \"$(pwd)/fix_global.h\"" drivers/bus/mhi/controllers/mhi_arch_qcom.c
             sed -i 's/ipc_log_context_create/(void *)ipc_log_context_create/g' drivers/bus/mhi/controllers/mhi_arch_qcom.c
          fi

          # 6. GLOBAL PINCTRL FIX (Cast everything to prevent linker mismatches)
          find drivers/ -name "*.c" -exec sed -i 's/pinctrl_lookup_state(/(void *)pinctrl_lookup_state(/g' {} +
          find drivers/ -name "*.c" -exec sed -i 's/devm_pinctrl_get(/(void *)devm_pinctrl_get(/g' {} +

          # 7. Optimization
          scripts/config --disable CONFIG_ARM64_LSE_ATOMICS

      - name: Build Kernel
        run: |
          make -j$(nproc --all) \
            LLVM=1 \
            LLVM_IAS=0 \
            ARCH=arm64 \
            DTC_EXT=dtc \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-strict-prototypes -Wno-return-type -Wno-int-conversion -I$(pwd)/drivers/hid -I$(pwd)" \
            Image.gz-dtb

      - name: Prepare Artifacts
        run: |
          mkdir -p out
          [ -f arch/arm64/boot/Image.gz-dtb ] && cp arch/arm64/boot/Image.gz-dtb out/
          find arch/arm64/boot/dts/qcom/ -name "*.dtb" -exec cp {} out/ \;

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Raphael-Kernel-A15-V19-LINKED
          path: out/*
