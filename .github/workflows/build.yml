name: Build Raphael F1xy A15
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3

      - name: Patch F1xy Scheduler Errors
        run: |
          # 1. Define missing Boost ID at the top of the header
          sed -i '1i #define FULL_THROTTLE_BOOST 2' include/linux/sched.h
          
          # 2. Add 'mark_reserved' and 'trace' to the VERY TOP of fair.c
          # This prevents "conflicting types" because the compiler sees them first.
          sed -i '1i void mark_reserved(int cpu) {}' kernel/sched/fair.c
          sed -i '2i void trace_sched_load_balance_skip_tasks(int a, int b, int c, int d, int e) {}' kernel/sched/fair.c
          
          # 3. Fix the "Mixing declarations and code" error (C90 violation)
          # We search for the problematic line and move it up.
          sed -i '/struct cfs_rq \*cfs_rq;/d' kernel/sched/fair.c
          sed -i '3i struct cfs_rq *cfs_rq;' kernel/sched/fair.c

      - name: Configure and Compile
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          make raphael_defconfig
          
          # Hack/Feature Enables
          scripts/config --enable CONFIG_KALLSYMS
          scripts/config --enable CONFIG_KALLSYMS_ALL
          scripts/config --enable CONFIG_MODULES
          
          # Fastboot & Boot stability fixes
          scripts/config --enable CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE
          scripts/config --enable CONFIG_BUILD_ARM64_DT_OVERLAY
          
          make olddefconfig
          
          # Build with KCFLAGS to ignore minor non-critical warnings
          make -j$(nproc --all) \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-declaration-after-statement" \
            Image.gz-dtb dtbs modules

      - name: Organize Artifacts
        if: always()
        run: |
          mkdir -p out/modules
          if [ -f arch/arm64/boot/Image.gz-dtb ]; then
            cp arch/arm64/boot/Image.gz-dtb out/f1xy-A15-boot.img
          fi
          find . -name "*.ko" -exec cp {} out/modules/ \;

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Raphael-F1xy-A15-Fixed
          path: out/
