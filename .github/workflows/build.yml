name: Build Raphael F1xy A15
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3

      - name: Patch Source Errors
        run: |
          # 1. Define Boost
          sed -i '1i #define FULL_THROTTLE_BOOST 2' include/linux/sched.h
          
          # 2. Scheduler Fixes (The 7-arg fix)
          # We put these at the very top to avoid "conflicting types"
          sed -i '1i void mark_reserved(int cpu) {}' kernel/sched/fair.c
          sed -i '2i void trace_sched_load_balance_skip_tasks(int a, int b, int c, int d, int e, int f, unsigned long g) {}' kernel/sched/fair.c
          sed -i '/struct cfs_rq \*cfs_rq;/d' kernel/sched/fair.c
          sed -i '3i struct cfs_rq *cfs_rq;' kernel/sched/fair.c
          
          # 3. MHI Driver "Middle-Nuke"
          # Deletes lines 100 to 160. This kills the functions + brackets 
          # but leaves the #ifndef and #endif guards alone.
          sed -i '100,160d' drivers/bus/mhi/controllers/mhi_qcom.h
          
          # 4. Fix missing MAX_MSG_SIZE
          sed -i '1i #define MAX_MSG_SIZE 4096' drivers/bus/mhi/controllers/mhi_arch_qcom.c

      - name: Configure and Compile
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          make raphael_defconfig
          
          # Hacks & Game Feature Support
          scripts/config --enable CONFIG_KALLSYMS
          scripts/config --enable CONFIG_KALLSYMS_ALL
          scripts/config --enable CONFIG_MODULES
          
          # DTB Fix
          scripts/config --disable CONFIG_BUILD_ARM64_EMBEDDED_DTB
          scripts/config --enable CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE
          
          make olddefconfig
          
          make -j$(nproc --all) \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-declaration-after-statement" \
            Image.gz dtbs modules

      - name: Organize Artifacts
        if: always()
        run: |
          mkdir -p out
          if [ -f arch/arm64/boot/Image.gz ]; then
            # Find any valid DTB and append it to the kernel
            cat arch/arm64/boot/Image.gz $(find arch/arm64/boot/dts/qcom -name "*.dtb" | head -n 1) > out/f1xy-A15-boot.img || true
          fi
          find . -name "*.ko" -exec cp {} out/ \;

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Raphael-F1xy-A15-Final
          path: out/
