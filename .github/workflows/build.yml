name: Rikka V5 Final Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Environment
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm curl git

      - name: Setup Toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          wget https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
          tar -xf master.tar.gz
          echo "PROTON_PATH=$(pwd)/proton-clang-master/bin" >> $GITHUB_ENV

      - name: Compile Kernel
        run: |
          mkdir -p out
          
          # 1. SCRUBBER
          find . -type f -name "Makefile*" -o -name "*.kbuild" -o -name "*.inc" | xargs sed -i 's/-mllvm//g' || true
          find . -type f -name "Makefile*" -o -name "*.kbuild" | xargs sed -i 's/-hot-cold-split=true//g' || true
          find . -type f -name "Makefile*" -o -name "*.kbuild" | xargs sed -i 's/-regalloc-enable-advisor=release//g' || true
          find . -type f -name "Makefile*" -o -name "*.kbuild" | xargs sed -i 's/-ftrivial-auto-var-init=zero//g' || true

          export HOSTCC=gcc
          export HOSTCXX=g++
          export HOSTLDFLAGS="-fuse-ld=bfd"

          # 2. GENERATE INITIAL CONFIG
          make O=out ARCH=arm64 raphael_defconfig \
               CC=${{ env.PROTON_PATH }}/clang \
               HOSTCC=$HOSTCC \
               HOSTCXX=$HOSTCXX \
               HOSTLDFLAGS="$HOSTLDFLAGS"

          # 3. FORCE-ENABLE REQUIRED SUBSYSTEMS
          # Display/Backlight
          scripts/config --file out/.config -e BACKLIGHT_CLASS_DEVICE -e BACKLIGHT_LCD_SUPPORT -e LCD_CLASS_DEVICE
          
          # WiFi & Connectivity (ICNSS)
          scripts/config --file out/.config -e ICNSS -e ICNSS_QMI -e ICNSS_DEBUG
          
          # Audio & Calibration (TFA98xx dependencies)
          scripts/config --file out/.config -e SND_SOC_WCD_CPE -e MSMLAB_COMMON -e SND_SOC_TFA98XX
          
          # Subsystem Restart & ESOC (The 'subsys' errors)
          scripts/config --file out/.config -e MSM_SUBSYSTEM_RESTART -e MSM_PIL -e ESOC -e ESOC_DEV
          
          # Re-sync and accept defaults
          make O=out ARCH=arm64 olddefconfig \
               CC=${{ env.PROTON_PATH }}/clang \
               HOSTCC=$HOSTCC \
               HOSTCXX=$HOSTCXX \
               HOSTLDFLAGS="$HOSTLDFLAGS"

          # 4. BUILD KERNEL
          make -j$(nproc --all) O=out \
               ARCH=arm64 \
               CC="${{ env.PROTON_PATH }}/clang -enable-trivial-auto-var-init-zero-knowing-it-will-be-removed-from-clang" \
               LD=${{ env.PROTON_PATH }}/ld.lld \
               AR=${{ env.PROTON_PATH }}/llvm-ar \
               NM=${{ env.PROTON_PATH }}/llvm-nm \
               OBJCOPY=${{ env.PROTON_PATH }}/llvm-objcopy \
               OBJDUMP=${{ env.PROTON_PATH }}/llvm-objdump \
               STRIP=${{ env.PROTON_PATH }}/llvm-strip \
               OBJSIZE=${{ env.PROTON_PATH }}/llvm-size \
               CROSS_COMPILE=${{ env.PROTON_PATH }}/aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=${{ env.PROTON_PATH }}/arm-linux-gnueabi- \
               HOSTCC=$HOSTCC \
               HOSTCXX=$HOSTCXX \
               HOSTLDFLAGS="$HOSTLDFLAGS"

      - name: Upload Finished Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Rikka-V5-Success
          path: out/arch/arm64/boot/Image.gz-dtb
