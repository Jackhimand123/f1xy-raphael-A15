name: Build Raphael Hack Kernel (FIXED)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3

      - name: Configure and Compile
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # HACK SUPPORT: Enable the stuff you need for game tools
          make raphael_defconfig
          scripts/config --enable CONFIG_KALLSYMS
          scripts/config --enable CONFIG_KALLSYMS_ALL
          scripts/config --enable CONFIG_MODULES
          
          # FASTBOOT FIX: We MUST keep these ENABLED for Raphael to boot
          scripts/config --enable CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE
          scripts/config --enable CONFIG_BUILD_ARM64_DT_OVERLAY
          
          make olddefconfig
          
          # We build Image.gz-dtb (this is the one that actually boots!)
          make -j$(nproc --all) CC=clang CLANG_TRIPLE=aarch64-linux-gnu- Image.gz-dtb dtbs modules

      - name: Organize Artifacts
        run: |
          mkdir -p out/modules
          # We grab the -dtb version so you don't get stuck in fastboot
          cp arch/arm64/boot/Image.gz-dtb out/f1xy-hack-boot.img
          find . -
