name: Raphael Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            build-essential \
            flex \
            bison \
            lld \
            llvm \
            clang \
            libssl-dev \
            libelf-dev \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            device-tree-compiler \
            python3 \
            git \
            zip

      - name: Set Up Build Environment
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV

      - name: Configure and Patch
        run: |
          # 1. Generate the base config
          make ARCH=arm64 raphael_defconfig
          
          # 2. Apply Scheduler Tweaks
          if [ -f kernel/sched/fair.c ]; then
            sed -i 's/sysctl_sched_latency = 6000000ULL/sysctl_sched_latency = 4000000ULL/g' kernel/sched/fair.c
          fi
          sed -i '1i #define SCHED_FULL_THROTTLE 1' kernel/sched/sched.h

          # 3. FIX: Disable LSE Atomics to stop the ".org offset" error
          # This forces the kernel to use the standard atomic instructions 
          # which are much more stable for cross-compiling.
          scripts/config --disable CONFIG_ARM64_LSE_ATOMICS

      - name: Build Kernel
        run: |
          # LLVM_IAS=0 is the most important part here. 
          # It tells Clang to use the GNU Assembler for the tricky assembly parts.
          make -j$(nproc --all) \
            LLVM=1 \
            LLVM_IAS=0 \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-strict-prototypes -Wno-return-type" \
            Image.gz-dtb

      - name: Prepare Artifacts
        run: |
          mkdir -p out
          [ -f arch/arm64/boot/Image.gz-dtb ] && cp arch/arm64/boot/Image.gz-dtb out/
          [ -f arch/arm64/boot/Image.gz ] && cp arch/arm64/boot/Image.gz out/
          find arch/arm64/boot/dts/qcom/ -name "*.dtb" -exec cp {} out/ \;

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Raphael-Kernel-LSE-Fixed
          path: out/*
