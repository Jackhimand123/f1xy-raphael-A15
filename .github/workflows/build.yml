name: Raphael Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc build-essential flex bison lld llvm clang libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu device-tree-compiler \
            python3 git zip

      - name: Set Up Build Environment
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV

      - name: Configure and Patch
        run: |
          # 1. Base Config
          make ARCH=arm64 raphael_defconfig
          
          # 2. FIX: Global definitions
          cat <<EOF > fix_global.h
          #ifndef _FIX_GLOBAL_H
          #define _FIX_GLOBAL_H
          #define SCHED_FULL_THROTTLE 1
          #define FULL_THROTTLE_BOOST 1
          #endif
          EOF
          sed -i "1i #include \"$(pwd)/fix_global.h\"" kernel/sched/sched.h
          
          # 3. MANUAL FIX: LED Header Reconstruction
          cat <<EOF > drivers/leds/leds.h
          #ifndef __LEDS_H_INCLUDED
          #define __LEDS_H_INCLUDED
          #include <linux/device.h>
          #include <linux/rwlock.h>
          #include <linux/list.h>
          #include <linux/leds.h>
          #include <linux/rwsem.h>
          extern struct rw_semaphore leds_list_lock;
          extern struct list_head leds_list;
          void led_stop_software_blink(struct led_classdev *led_cdev);
          void led_set_brightness_nosleep(struct led_classdev *led_cdev, enum led_brightness value);
          static inline struct led_classdev *led_trigger_get_target(struct led_trigger *trig) { return NULL; }
          #endif
          EOF

          # 4. MANUAL FIX: HID Tracepoint Shortcut
          if [ -f drivers/hid/hid-trace.h ]; then
            ln -sf drivers/hid/hid-trace.h ./hid-trace.h
          fi

          # 5. FIX: MHI/Modem pointer conversion
          if [ -f drivers/bus/mhi/controllers/mhi_arch_qcom.c ]; then
             sed -i "1i #include <linux/types.h>" drivers/bus/mhi/controllers/mhi_arch_qcom.c
             sed -i "2i #define MAX_MSG_SIZE 255" drivers/bus/mhi/controllers/mhi_arch_qcom.c
             sed -i 's/ipc_log_context_create/(void *)(uintptr_t)ipc_log_context_create/g' drivers/bus/mhi/controllers/mhi_arch_qcom.c
          fi

          # 6. Performance
          if [ -f kernel/sched/fair.c ]; then
            sed -i 's/sysctl_sched_latency = 6000000ULL/sysctl_sched_latency = 4000000ULL/g' kernel/sched/fair.c
          fi
          scripts/config --disable CONFIG_ARM64_LSE_ATOMICS

      - name: Build Kernel
        run: |
          make -j$(nproc --all) \
            LLVM=1 \
            LLVM_IAS=0 \
            ARCH=arm64 \
            DTC_EXT=dtc \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-strict-prototypes -Wno-return-type -I$(pwd)/drivers/hid -I$(pwd)" \
            Image.gz-dtb

      - name: Prepare Artifacts
        run: |
          mkdir -p out
          [ -f arch/arm64/boot/Image.gz-dtb ] && cp arch/arm64/boot/Image.gz-dtb out/
          find arch/arm64/boot/dts/qcom/ -name "*.dtb" -exec cp {} out/ \;

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Raphael-Kernel-A15-V16
          path: out/*
