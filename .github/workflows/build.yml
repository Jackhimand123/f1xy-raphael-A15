name: Build Raphael F1xy A15
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3

      - name: Patch F1xy Scheduler Errors
        run: |
          # Fix the 'FULL_THROTTLE_BOOST' error by defining it manually
          sed -i '40i #define FULL_THROTTLE_BOOST 2' include/linux/sched.h
          
          # Fix 'mark_reserved' and 'trace' errors by adding empty functions
          # This stops the "Undeclared Identifier" crash
          echo "void mark_reserved(int cpu) {}" >> kernel/sched/fair.c
          echo "void trace_sched_load_balance_skip_tasks(int a, int b, int c, int d, int e) {}" >> kernel/sched/fair.c

      - name: Configure and Compile
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # Load your defconfig
          make raphael_defconfig
          
          # Enable your Hack/Dev features
          scripts/config --enable CONFIG_KALLSYMS
          scripts/config --enable CONFIG_KALLSYMS_ALL
          scripts/config --enable CONFIG_MODULES
          
          # Force Enable Boot requirements (Fastboot Fix)
          scripts/config --enable CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE
          scripts/config --enable CONFIG_BUILD_ARM64_DT_OVERLAY
          
          make olddefconfig
          
          # Compile with 'KCFLAGS' to ignore remaining warnings
          make -j$(nproc --all) \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-declaration-after-statement" \
            Image.gz-dtb dtbs modules

      - name: Organize Artifacts
        if: always()
        run: |
          mkdir -p out/modules
          # Check if the bootable image was created
          if [ -f arch/arm64/boot/Image.gz-dtb ]; then
            cp arch/arm64/boot/Image.gz-dtb out/f1xy-A15-boot.img
          else
            echo "Kernel build failed, check logs above."
            exit 1
          fi
          find . -name "*.ko" -exec cp {} out/modules/ \;

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Raphael-F1xy-A15-Fixed
          path: out/
