name: Build Raphael F1xy A15
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3

      - name: Patch Source Errors
        run: |
          # 1. Scheduler Fixes (The 7-arg fix)
          sed -i '1i #define FULL_THROTTLE_BOOST 2' include/linux/sched.h
          sed -i '1i void mark_reserved(int cpu) {}' kernel/sched/fair.c
          sed -i '2i void trace_sched_load_balance_skip_tasks(int a, int b, int c, int d, int e, int f, unsigned long g) {}' kernel/sched/fair.c
          sed -i '/struct cfs_rq \*cfs_rq;/d' kernel/sched/fair.c
          sed -i '3i struct cfs_rq *cfs_rq;' kernel/sched/fair.c
          
          # 2. MHI Driver Fix (The "Stub" Strategy)
          # We replace the conflicting definitions with empty "stubs" 
          # This keeps the file structure intact and avoids unterminated directive errors.
          sed -i 's/static inline int mhi_arch_iommu_init.*/static inline int mhi_arch_iommu_init(struct mhi_controller *mhi_cntrl) { return 0; } \/\//' drivers/bus/mhi/controllers/mhi_qcom.h
          sed -i 's/static inline int mhi_arch_pcie_init.*/static inline int mhi_arch_pcie_init(struct mhi_controller *mhi_cntrl) { return 0; } \/\//' drivers/bus/mhi/controllers/mhi_qcom.h
          sed -i 's/static inline int mhi_arch_link_suspend.*/static inline int mhi_arch_link_suspend(struct mhi_controller *mhi_cntrl) { return 0; } \/\//' drivers/bus/mhi/controllers/mhi_qcom.h
          sed -i 's/static inline int mhi_arch_link_resume.*/static inline int mhi_arch_link_resume(struct mhi_controller *mhi_cntrl) { return 0; } \/\//' drivers/bus/mhi/controllers/mhi_qcom.h
          sed -i 's/static inline int mhi_arch_power_up.*/static inline int mhi_arch_power_up(struct mhi_controller *mhi_cntrl) { return 0; } \/\//' drivers/bus/mhi/controllers/mhi_qcom.h
          
          # 3. Fix missing MAX_MSG_SIZE
          sed -i '1i #define MAX_MSG_SIZE 4096' drivers/bus/mhi/controllers/mhi_arch_qcom.c

      - name: Configure and Compile
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          make raphael_defconfig
          
          # Enable necessary features for A15
          scripts/config --enable CONFIG_KALLSYMS
          scripts/config --enable CONFIG_KALLSYMS_ALL
          scripts/config --enable CONFIG_MODULES
          
          # Fastboot/DTB Fixes
          scripts/config --disable CONFIG_BUILD_ARM64_EMBEDDED_DTB
          scripts/config --enable CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE
          
          make olddefconfig
          
          # Build the kernel
          make -j$(nproc --all) \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-declaration-after-statement" \
            Image.gz dtbs modules

      - name: Organize Artifacts
        if: always()
        run: |
          mkdir -p out
          if [ -f arch/arm64/boot/Image.gz ]; then
            # Append the device tree to the kernel image
            cat arch/arm64/boot/Image.gz $(find arch/arm64/boot/dts/qcom -name "*.dtb" | head -n 1) > out/f1xy-A15-boot.img || true
          fi
          find . -name "*.ko" -exec cp {} out/ \;

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Raphael-F1xy-A15-Final
          path: out/
