name: Raphael Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc build-essential flex bison lld llvm clang libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu device-tree-compiler \
            python3 git zip

      - name: Set Up Build Environment
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV

      - name: Configure and Patch
        run: |
          # 1. Base Config
          make ARCH=arm64 raphael_defconfig
          
          # 2. FIX: Global definitions
          cat <<EOF > fix_global.h
          #ifndef _FIX_GLOBAL_H
          #define _FIX_GLOBAL_H
          #define SCHED_FULL_THROTTLE 1
          #define FULL_THROTTLE_BOOST 1
          #define MAX_MSG_SIZE 255
          #endif
          EOF
          sed -i "1i #include \"$(pwd)/fix_global.h\"" kernel/sched/sched.h
          
          # 3. FIX: HID Tracepoint Symbolic Link
          if [ -f drivers/hid/hid-trace.h ]; then
            ln -sf drivers/hid/hid-trace.h ./hid-trace.h
          fi

          # 4. FIX: MHI Driver Errors
          if [ -f drivers/bus/mhi/controllers/mhi_arch_qcom.c ]; then
             sed -i "1i #include \"$(pwd)/fix_global.h\"" drivers/bus/mhi/controllers/mhi_arch_qcom.c
             sed -i 's/ipc_log_context_create/(void *)ipc_log_context_create/g' drivers/bus/mhi/controllers/mhi_arch_qcom.c
          fi

          # 5. FIX: LED Class Mismatch (Clean Wipe)
          if [ -f drivers/leds/leds.h ]; then
            # Empty the target function to prevent structure member errors
            sed -i '/struct led_classdev \*led_trigger_get_target/,/^}/ d' drivers/leds/leds.h
            echo "struct led_classdev *led_trigger_get_target(struct led_trigger *trig) { return NULL; }" >> drivers/leds/leds.h
          fi

          # 6. FIX: UFS Pinctrl cast
          if [ -f drivers/scsi/ufs/ufshcd-pltfrm.c ]; then
            sed -i 's/hba->pctrl = devm_pinctrl_get(hba->dev);/hba->pctrl = (struct pinctrl *)devm_pinctrl_get(hba->dev);/g' drivers/scsi/ufs/ufshcd-pltfrm.c
          fi

          # 7. Compatibility Fixes
          scripts/config --disable CONFIG_ARM64_LSE_ATOMICS

      - name: Build Kernel
        run: |
          make -j$(nproc --all) \
            LLVM=1 \
            LLVM_IAS=0 \
            ARCH=arm64 \
            DTC_EXT=dtc \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-strict-prototypes -Wno-return-type -I$(pwd)/drivers/hid -I$(pwd)" \
            Image.gz-dtb

      - name: Prepare Artifacts
        run: |
          mkdir -p out
          [ -f arch/arm64/boot/Image.gz-dtb ] && cp arch/arm64/boot/Image.gz-dtb out/
          find arch/arm64/boot/dts/qcom/ -name "*.dtb" -exec cp {} out/ \;

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Raphael-Kernel-A15-V12
          path: out/*
